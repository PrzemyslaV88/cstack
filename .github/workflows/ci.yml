name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.16.0', '24']
    env:
      CSTACK_TEST_RUNNER: docker
      CSTACK_TEST_IMAGE: node:22.16.0-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # This is explicit CI setup, not an implicit runtime network/billing fallback.
      - run: docker pull "$CSTACK_TEST_IMAGE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s bench -t . -p 'test_*.py' -v
      - run: python -m py_compile bench/harbor_agents.py bench/lab.py bench/protocol.py
      # No API keys, live models, user credentials, pushes or deployments.
